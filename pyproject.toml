[project]
name = "autoredistrict"
version = "0.1.0"
description = "Congressional redistricting application with automatic district generation"
requires-python = ">=3.12"
dependencies = [
    "census",
    "fastapi",
    "geopandas",
    "matplotlib",
    "numpy",
    "pandas",
    "pandas-stubs>=3.0.0.260204",
    "requests",
    "shapely",
    "us",
    "pydataverse",
    "pyyaml",
    "ttkbootstrap",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
]

[tool.pytest.ini_options]
pythonpath = ["."]
